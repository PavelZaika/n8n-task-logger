version: '3.8'
services:
n8n:
image: n8nio/n8n:latest
container_name: n8n
restart: unless-stopped
ports:
- "5678:5678"
environment:
- N8N_OWNER_EMAIL=admin@local.test
- N8N_OWNER_PASSWORD=changeme
- N8N_SKIP_ONBOARDING=true
- GENERIC_TIMEZONE=Europe/Moscow
- N8N_RESTRICT_FILE_ACCESS_TO=/files
volumes:
- n8n_data:/home/node/.n8n
- ./local-files:/files
volumes:
n8n_data:
